spring:
  application:
    name: nginx-lab
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:users_bd}
    username: ${DB_USERNAME:root}   
    password: ${DB_PASSWORD:1134}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true        
    properties:
      hibernate:
        format_sql: true  
server:
  port: 8080