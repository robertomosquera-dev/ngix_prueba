services:

  api:
    build: ./api_nginx
    container_name: spring-api
    expose:
      - "8080"
    networks:
      - backend


  nginx:
    image: nginx:latest
    container_name: nginx-lab
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - backend


networks:

  backend:
    external: true